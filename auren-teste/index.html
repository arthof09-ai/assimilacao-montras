<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14100a">
  <link rel="icon" href="data:,">
  <title>Campo de Batalha · Assimilação — TESTE Sikong Auren</title>
  <link rel="stylesheet" href="jogo.css">
</head>
<body>
  <main id="mapa" aria-label="Campo de batalha tridimensional"></main>

  <!-- Camada da casca para os números de dano flutuantes e o efeito de
       impacto (tranche T1.2): elementos criados por jogo.js, posicionados
       sobre a figura atacada pela projecção da cena (projectUnit). -->
  <div id="danos" aria-hidden="true"></div>
  <!-- A cena (rodada 2) cria a sua própria camada de etiquetas (.etiquetas)
       dentro de #mapa; a casca só lhe dá o estilo (.nome, em jogo.css). -->

  <!-- Cantos (lei do Mestre, 02/11 23:09): canto superior esquerdo =
       engrenagem; abaixo dela, tela cheia. O pop-up rápido abre sob a engrenagem. -->
  <div id="cantos" aria-label="Cantos de apresentação">
    <button id="btn-config" class="cornerbtn" aria-label="Configurações rápidas" aria-expanded="false" title="Configurações rápidas">⚙</button>
    <button id="btn-cheia" class="cornerbtn quadrado" aria-label="Tela cheia" title="Tela cheia">⛶</button>
    <!-- S-001+M-016: o botão de alertas (!) é superfície do Supervisor —
         vive só na vista do Mestre (mestre.html). Nesta página da
         jogadora ele não existe. -->
  </div>

  <!-- Pop-up de configurações rápidas: aperta, aparece; escolhe; aperta, some. -->
  <section id="cfgpop" hidden aria-label="Configurações rápidas">
    <h3>Apresentação</h3>
    <div class="cfgrow">
      <span class="cl">Câmera</span>
      <div class="seg" role="group" aria-label="Câmera">
        <button id="cam-fixa" type="button">▦ Fixa</button>
        <button id="cam-seguir" type="button">◎ Seguir</button>
        <button id="cam-360" type="button">⟳ 360°</button>
      </div>
    </div>
    <div class="cfgrow">
      <span class="cl">Zoom</span>
      <div class="zoomctl">
        <button id="zoom-menos" class="zb" type="button" aria-label="Afastar câmera">−</button>
        <span id="zoom-valor" class="zv">1,0×</span>
        <button id="zoom-mais" class="zb" type="button" aria-label="Aproximar câmera">+</button>
      </div>
    </div>
    <div class="cfgrow">
      <span class="cl">Ajuda do grid<small>casas acesas ao mover</small></span>
      <button id="tog-grid" class="tog on" type="button" aria-pressed="true">Ligada</button>
    </div>
    <div class="cfgrow">
      <span class="cl">Números de dano<small>parcelas ao acertar</small></span>
      <button id="tog-danos" class="tog on" type="button" aria-pressed="true">Ligados</button>
    </div>
    <div class="cfgrow">
      <span class="cl">Qualidade</span>
      <div class="seg" role="group" aria-label="Qualidade">
        <button data-qualidade="baixa" type="button">Baixa</button>
        <button data-qualidade="media" type="button">Média</button>
        <button data-qualidade="alta" type="button">Alta</button>
      </div>
    </div>
    <p id="stats" class="stats">— FPS</p>
  </section>

  <!-- Selo da fronteira do protótipo (spec §4.3 / M-006): permanente,
       discreto, sem capturar toques (pointer-events:none no CSS). -->
  <div id="selo-teste" role="note">TESTE — resolvedor local</div>

  <!-- Ficha fechada: pop-up flutuante da própria personagem (só dados dela).
       M-015: os valores iniciais já nascem certos (Vida 99/99, Alma livre 91)
       e jogo.js (atualizarChip) reescreve rótulo e barras a cada mudança. -->
  <button id="fichachip" type="button" aria-label="Abrir a ficha da Ong">
    <span class="fh"><span class="fname">ONG</span><span class="fopen">FICHA ▸</span></span>
    <span class="bl"><span>VIDA</span><span id="chip-alma-rotulo">ALMA · PA 91</span></span>
    <span class="bar vida"><i style="width:100%"></i></span>
    <span class="bar alma"><i style="width:100%"></i></span>
  </button>

  <!-- Ficha aberta: coluna lateral de 25% (conteúdo gerado por jogo.js). -->
  <aside id="ficha" hidden aria-label="Ficha da figura"></aside>

  <!-- Faixa de baixo: UMA só, 56 px fixos, só acções de batalha +
       a linha de mensagem VISÍVEL. Apertar troca o miolo, nunca o tamanho. -->
  <nav id="faixa" aria-label="Acções da rodada de batalha">
    <div class="turn">
      <span class="tl" id="vez-rotulo">VEZ DE</span>
      <span class="tn" id="vez-nome">Ong</span>
      <span class="rd" id="vez-rodada">R2</span>
    </div>
    <p id="mensagem" role="status" aria-live="polite"><span id="mensagem-txt"></span></p>
    <div id="acoes" class="actions"></div>
  </nav>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="mundo.js"></script>
  <script src="cena.js"></script>
  <script src="visual.js"></script>
  <script src="levelup.js"></script>
  <script src="vlab-completo.js"></script>
  <script src="jogo.js"></script>
</body>
</html>
